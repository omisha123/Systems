<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>SYSTEMS — What actually happens?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#02050e;--ink:#eaf2ff;--mu:#7f93b6;--ln:rgba(90,160,255,.22);--gl:rgba(20,40,80,.55);--ac:#2f8cff;--cy:#4fd8ff;--g:#25e08a;--pk:#ff5d7a;--yl:#ffd25a;--p:clamp(18px,4vw,48px);--hf:'Chakra Petch',system-ui,sans-serif;--mf:'IBM Plex Mono',ui-monospace,monospace;--panel:linear-gradient(145deg,rgba(10,22,45,.9),rgba(3,7,18,.98));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--hf);overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.hero{position:relative;min-height:100svh;padding:calc(var(--p) + 90px) var(--p) calc(var(--p) + 50px);display:flex;flex-direction:column;justify-content:center;gap:28px;overflow:hidden}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:18px;padding:var(--p)}
.top img{width:clamp(48px,7vw,72px);height:clamp(48px,7vw,72px);border-radius:16px;object-fit:cover;flex:none;box-shadow:0 0 28px rgba(79,216,255,.25)}
.top .tl{position:relative;flex:1;height:1px;background:linear-gradient(90deg,rgba(79,216,255,.15),var(--cy),rgba(79,216,255,.15));overflow:hidden}
.top .tl:after{content:"";position:absolute;top:-1px;left:-80px;width:80px;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:lkp 4s linear infinite}
.mega{margin:10px 0 0;font-size:clamp(56px,19vw,280px);line-height:.85;letter-spacing:-.045em;text-transform:uppercase;background:linear-gradient(180deg,#fff 10%,#86c4ff 55%,#2f6dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(47,140,255,.55))}
.out{margin:14px 0 0;font-size:clamp(22px,5vw,64px);font-weight:600;color:transparent;-webkit-text-stroke:1.3px rgba(150,205,255,.85)}
.row{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap}
.row p{margin:0;max-width:440px;font-size:clamp(17px,2vw,24px);color:var(--mu)}.row p b{color:var(--cy)}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px}.qr img{width:clamp(110px,16vw,140px);height:auto;padding:8px;background:#fff;border-radius:14px;image-rendering:pixelated;box-shadow:0 0 30px rgba(79,216,255,.3)}.qr span{font:600 11px var(--mf);letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.go{border:1px solid var(--cy);border-radius:12px;padding:15px 26px;background:rgba(47,140,255,.2);font-weight:700;box-shadow:0 0 30px rgba(47,140,255,.4);transition:.2s}
.go:hover{background:var(--ac);transform:translateY(-3px)}
.chain{display:flex;align-items:center;max-width:620px}
.chain svg{width:clamp(46px,9vw,80px);flex:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:fl 4s ease-in-out infinite}
.chain svg:nth-of-type(2){animation-delay:-1s}.chain svg:nth-of-type(3){animation-delay:-2s}.chain svg:nth-of-type(4){animation-delay:-3s}
@keyframes fl{50%{transform:translateY(-8px)}}
.lk{flex:1;min-width:18px;height:3px;background:rgba(79,216,255,.28);position:relative;overflow:hidden;margin:0 6px}
.lk:after{content:"";position:absolute;top:0;left:-30px;width:30px;height:100%;background:linear-gradient(90deg,transparent,#fff);animation:lkp 3s linear infinite}
.lk:nth-of-type(2):after{animation-delay:1s}.lk:nth-of-type(3):after{animation-delay:2s}
@keyframes lkp{to{left:100%}}
.mq{position:absolute;left:0;right:0;bottom:0;overflow:hidden;white-space:nowrap;border-block:1px solid var(--ln);background:rgba(2,8,20,.65);backdrop-filter:blur(8px)}
.mq div{display:inline-block;padding:13px 0;font:600 12px var(--mf);letter-spacing:.18em;text-transform:uppercase;color:var(--mu);animation:mq 28s linear infinite}
.mq span{margin:0 18px}.mq span:nth-child(2n){color:var(--cy)}
@keyframes mq{to{transform:translateX(-50%)}}

.playground{width:min(1280px,100% - 2*var(--p));margin:0 auto;padding:100px 0 120px}
.pghead{position:relative;margin-bottom:56px}
.eyebrow{font:600 12px var(--mf);letter-spacing:.24em;color:var(--cy);margin-bottom:20px}
h3{margin:0;letter-spacing:-.03em}
.pghead h3{max-width:1050px;font-size:clamp(52px,9vw,128px);line-height:.85;letter-spacing:-.06em;text-transform:uppercase}
.pghead h3 em{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(150,205,255,.65)}
.sub{max-width:620px;margin:26px 0 0;font-size:clamp(15px,1.6vw,20px);line-height:1.5;color:var(--mu)}
.prog{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:24px;font:600 11px var(--mf);letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.pb{width:min(220px,40vw);height:6px;border-radius:9px;background:rgba(127,147,182,.18);overflow:hidden}.pb b{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}
.rs{border:1px solid var(--pk);background:rgba(255,93,122,.12);border-radius:12px;padding:12px 20px;font:700 12px var(--mf);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);transition:.2s}
.rs:hover{background:var(--pk);transform:translateY(-2px)}

/* coverflow */
.cf{position:relative;perspective:1200px;overflow:hidden;padding:24px 0}
.stage{position:relative;height:clamp(380px,56vw,420px);--dx:clamp(150px,27vw,270px);touch-action:pan-y}
.cc{position:absolute;left:50%;top:0;width:clamp(210px,62vw,290px);height:100%;padding:0;overflow:hidden;border-radius:24px;border:1px solid var(--ln);background:linear-gradient(160deg,rgba(14,28,58,.96),rgba(3,7,18,.98));text-align:left;display:flex;flex-direction:column;filter:brightness(.55) saturate(.8);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s,box-shadow .5s,border-color .4s}
.cc.ac{filter:none;border-color:var(--c);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 60px -8px var(--c)}
.cc.done{border-color:rgba(37,224,138,.5)}
.art{position:relative;height:56%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#0a1226),#050b1a)}
.art:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--c) 38%,transparent),transparent 30%);opacity:.5}
.cc.ac .art:before{animation:spin 8s linear infinite}
.art svg{position:relative;width:42%;max-width:110px;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.nb{position:absolute;top:14px;left:16px;font:600 12px var(--mf);letter-spacing:.14em;color:#fff;opacity:.8}
.ck{position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--g);color:#02150b;font:700 14px/24px var(--mf);text-align:center}
.ci{display:flex;flex-direction:column;gap:7px;padding:16px 18px;flex:1}
.ci small{font:700 10px var(--mf);letter-spacing:.16em;color:var(--c)}
.ci b{font-size:clamp(22px,3.4vw,28px);line-height:1;letter-spacing:-.03em}
.mc{display:flex;gap:5px;margin-top:2px}
.mc svg{width:24px;height:24px;opacity:.75}
.rn{margin-top:auto;align-self:flex-start;padding:7px 14px;border-radius:99px;border:1px solid var(--c);color:var(--c);font:700 10px var(--mf);letter-spacing:.16em;opacity:0;transition:.4s}
.cc.ac .rn{opacity:1}
.ar{position:absolute;top:50%;translate:0 -50%;z-index:20;width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:rgba(10,22,45,.8);backdrop-filter:blur(6px);font-size:24px;transition:.2s}
.ar:hover{border-color:var(--cy);background:rgba(47,140,255,.3)}
.ar.l{left:8px}.ar.r{right:8px}
.dots{display:flex;justify-content:center;gap:10px;margin-top:22px}
.dots i{width:9px;height:9px;border-radius:6px;background:rgba(127,147,182,.35);cursor:pointer;transition:.3s}
.dots i.on{width:28px;background:var(--cy)}.dots i.dn{background:var(--g)}
.wrap{width:min(1180px,100% - 2*var(--p));margin:0 auto;padding:34px 0 90px}
.wrap>h3{font-size:clamp(40px,7vw,80px);line-height:.9;margin:30px 0 26px;letter-spacing:-.05em}
.bk{border:1px solid var(--ln);background:var(--gl);border-radius:10px;padding:9px 14px;color:var(--mu)}.bk:hover{color:var(--ink);border-color:var(--cy)}
.ask{font-size:clamp(17px,2vw,22px);color:var(--mu);margin:-10px 0 24px;max-width:720px;line-height:1.4}
.st{margin-top:20px;border:1px solid var(--ln);border-radius:24px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.tabs{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--ln);overflow:auto;background:rgba(2,7,18,.55);border-radius:24px 24px 0 0}
.tab{flex:1;min-width:150px;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px 16px;color:var(--mu);font:600 11px var(--mf);letter-spacing:.08em;text-transform:uppercase;transition:.2s}
.tab.on{background:rgba(79,216,255,.1);border-color:rgba(79,216,255,.35);color:var(--cy)}
.inp{display:block;width:calc(100% - 48px);margin:24px auto 0;padding:11px 14px;border-radius:10px;border:1px solid var(--ln);background:#050d1e;font:600 16px var(--mf)}
.pipe{display:flex;overflow-x:auto;margin:24px 18px 0;padding:34px 24px;justify-content:safe center;border:1px dashed var(--ln);border-radius:14px;background:rgba(2,8,20,.7)}
.nd{position:relative;flex:0 0 116px;padding:16px 8px;border:1px solid var(--ln);border-radius:12px;background:var(--gl);text-align:center;color:var(--mu);transition:.3s}
.nd svg{width:58px;height:58px;display:block;margin:0 auto 6px;opacity:.6;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));transition:.35s}
.nd b{display:block;margin-top:6px;font:600 10px var(--mf);white-space:nowrap}
.nd s{display:block;min-height:15px;margin-top:6px;text-decoration:none;font:600 10px var(--mf);color:var(--cy)}
.nd.seen{border-color:rgba(79,216,255,.5)}.nd.seen svg{opacity:.95}
.nd.on{border-color:var(--cy);box-shadow:0 0 34px rgba(79,216,255,.5);transform:translateY(-6px)}
.nd.on svg{transform:scale(1.1);filter:drop-shadow(0 0 16px var(--cy));opacity:1}.nd.on b{color:var(--ink)}
.nd.bad{border-color:var(--pk);box-shadow:0 0 30px rgba(255,93,122,.4);animation:sh .35s 3}
.nd.bad svg{filter:drop-shadow(0 0 16px var(--pk)) grayscale(.5);opacity:1}.nd.bad b{color:var(--pk)}
.nd.ok{border-color:var(--g)}.nd.ok svg{filter:drop-shadow(0 0 16px var(--g));opacity:1}.nd.ok b{color:var(--g)}
.nd.on:after{content:"";position:absolute;inset:-1px;border-radius:12px;border:2px solid var(--cy);pointer-events:none;animation:rp .8s ease-out forwards}
.nd.bad.on:after{border-color:var(--pk)}.nd.ok.on:after{border-color:var(--g)}
@keyframes sh{25%{translate:-4px 0}75%{translate:4px 0}}
@keyframes rp{to{transform:scale(1.45);opacity:0}}
.cb{flex:0 0 64px;align-self:flex-start;margin-top:43px;height:4px;border-radius:2px;background:rgba(127,147,182,.3);position:relative;overflow:hidden;transition:.3s}
.cb.lit{background:var(--cy);box-shadow:0 0 10px rgba(79,216,255,.7)}
.ls{position:absolute;top:0;left:-40px;width:40px;height:100%;background:linear-gradient(90deg,transparent,#fff);border-radius:2px}
.nt{margin:12px 24px 0;padding:11px 14px;min-height:44px;border-radius:10px;background:rgba(79,216,255,.06);border:1px solid var(--ln);color:var(--mu);font-size:14px;line-height:1.45}
.hud{display:flex;align-items:center;gap:12px;margin:18px 24px 0}
.hb{flex:1;height:5px;border-radius:9px;background:rgba(127,147,182,.2);overflow:hidden}.hb b{display:block;height:100%;width:0;border-radius:9px;transition:width .6s,background .3s}
.hm{min-width:76px;text-align:right;font:600 11px var(--mf)}
.ex{margin:24px;padding:24px;min-height:150px;border:1px solid var(--ln);border-radius:14px;background:rgba(5,13,29,.7);transition:border-color .3s}
.ex.bad{border-color:var(--pk)}.ex.ok{border-color:var(--g)}
.ex small{font:600 11px var(--mf);letter-spacing:.14em;color:var(--cy)}
.ex h4{margin:6px 0;font-size:clamp(25px,3vw,38px);letter-spacing:-.03em}
.ex p{margin:0;max-width:720px;color:var(--mu);line-height:1.55}.ex .an{margin-top:8px;color:var(--yl)}
.ctl{display:flex;gap:10px;align-items:center;padding:14px 24px 20px;border-top:1px solid var(--ln)}
.btn{width:42px;height:38px;padding:0;border:1px solid var(--ln);border-radius:10px;background:rgba(20,40,75,.5);font-weight:700;transition:.2s}.btn:hover{border-color:var(--cy)}.btn.c{background:rgba(79,216,255,.1)}
.ctl input{flex:1;min-width:80px;accent-color:var(--cy)}
.rv{margin-top:18px;padding:22px;border-radius:16px;border:1px solid var(--g);background:linear-gradient(135deg,rgba(37,224,138,.08),rgba(20,60,100,.08));font-weight:700;font-size:20px;animation:up .4s}
.rv small{display:block;margin-top:6px;font-weight:400;font-size:14px;color:var(--mu)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
abbr{position:relative;text-decoration:underline dotted var(--cy);text-underline-offset:4px;cursor:help;outline:none}
abbr:hover:after,abbr:focus:after{content:attr(data-d);position:absolute;left:0;bottom:calc(100% + 8px);width:min(250px,70vw);padding:10px 12px;border-radius:10px;background:#0b1a36;border:1px solid var(--cy);color:var(--ink);font:500 12px/1.45 var(--hf);letter-spacing:0;text-transform:none;white-space:normal;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
abbr.r:hover:after,abbr.r:focus:after{left:auto;right:0}
@media(max-width:800px){.playground{padding-top:70px}.cardcopy{padding-right:0}.try{position:static;margin-top:16px}.pipe{justify-content:flex-start}.tab{min-width:125px}.ex{margin:16px}.inp{width:calc(100% - 32px)}
.cards:before{left:20px}.stop,.stop:nth-child(even){justify-content:flex-end}.stop:nth-child(even) .card{margin-top:0}
.card{width:calc(100% - 60px)}.dot,.stop:nth-child(even) .dot{left:20px;top:50%;width:38px;height:38px}
.stop:before,.stop:nth-child(odd):before,.stop:nth-child(even):before{left:38px;top:50%;width:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#bg{display:none}}
</style></head><body>
