<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>SYSTEMS — What actually happens?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--hf);overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.hero{position:relative;min-height:100svh;padding:var(--p);display:flex;flex-direction:column;justify-content:center;gap:28px;overflow:hidden}
@keyframes pl{50%{opacity:.3}}
.mega{margin:10px 0 0;font-size:clamp(56px,19vw,280px);line-height:.85;letter-spacing:-.045em;text-transform:uppercase;background:linear-gradient(180deg,#fff 10%,#86c4ff 55%,#2f6dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(47,140,255,.55))}
.out{margin:14px 0 0;font-size:clamp(22px,5vw,64px);font-weight:600;color:transparent;-webkit-text-stroke:1.3px rgba(150,205,255,.85)}
.row{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap}
.row p{margin:0;max-width:440px;font-size:clamp(17px,2vw,24px);color:var(--mu)}.row p b{color:var(--cy)}
.go{border:1px solid var(--cy);border-radius:12px;padding:15px 26px;background:rgba(47,140,255,.2);font-weight:700;box-shadow:0 0 30px rgba(47,140,255,.4);transition:.2s}
.go:hover{background:var(--ac);transform:translateY(-3px)}
.chain{display:flex;align-items:center;max-width:620px}
.chain svg{width:clamp(46px,9vw,80px);flex:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:fl 4s ease-in-out infinite}
.chain svg:nth-of-type(2){animation-delay:-1s}.chain svg:nth-of-type(3){animation-delay:-2s}.chain svg:nth-of-type(4){animation-delay:-3s}
@keyframes fl{50%{transform:translateY(-8px)}}
.lk{flex:1;min-width:18px;height:3px;background:rgba(79,216,255,.28);position:relative;overflow:hidden;margin:0 6px}
.lk:after{content:"";position:absolute;top:0;left:-30px;width:30px;height:100%;background:linear-gradient(90deg,transparent,#fff);animation:lkp 3s linear infinite}
.lk:nth-of-type(2):after{animation-delay:1s}.lk:nth-of-type(3):after{animation-delay:2s}
@keyframes lkp{to{left:100%}}
.mq{position:absolute;left:0;right:0;bottom:0;overflow:hidden;white-space:nowrap;border-block:1px solid var(--ln);background:rgba(2,8,20,.65);backdrop-filter:blur(8px)}
.mq div{display:inline-block;padding:13px 0;font:600 12px var(--mf);letter-spacing:.18em;text-transform:uppercase;color:var(--mu);animation:mq 28s linear infinite}
.mq span{margin:0 18px}.mq span:nth-child(2n){color:var(--cy)}
@keyframes mq{to{transform:translateX(-50%)}}

.playground{width:min(1280px,100% - 2*var(--p));margin:0 auto;padding:100px 0 120px}
.pghead{position:relative;margin-bottom:56px}
.eyebrow{font:600 12px var(--mf);letter-spacing:.24em;color:var(--cy);margin-bottom:20px}
h3{margin:0;letter-spacing:-.03em}
.pghead h3{max-width:1050px;font-size:clamp(52px,9vw,128px);line-height:.85;letter-spacing:-.06em;text-transform:uppercase}
.pghead h3 em{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(150,205,255,.65)}
.sub{max-width:620px;margin:26px 0 0;font-size:clamp(15px,1.6vw,20px);line-height:1.5;color:var(--mu)}
.prog{display:flex;align-items:center;gap:14px;margin-top:24px;font:600 11px var(--mf);letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.pb{width:min(220px,40vw);height:6px;border-radius:9px;background:rgba(127,147,182,.18);overflow:hidden}.pb b{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{position:relative;overflow:hidden;min-height:290px;padding:28px 30px;text-align:left;border:1px solid var(--ln);border-radius:20px;display:flex;flex-direction:column;background:radial-gradient(circle at var(--x,100%) var(--y,0),color-mix(in srgb,var(--c) 18%,transparent),transparent 45%),linear-gradient(145deg,rgba(10,22,45,.92),rgba(3,7,18,.98));transform:perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0)) translateY(var(--ty,0));transition:transform .15s ease-out,border-color .3s,box-shadow .3s}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--c);box-shadow:0 0 22px var(--c);opacity:.7;transition:.3s}
.card:hover{--ty:-6px;border-color:var(--c);box-shadow:0 18px 55px rgba(0,0,0,.35),0 0 40px -10px var(--c)}.card:hover:before{opacity:1}
.card>*{position:relative}
.card.done{border-color:rgba(37,224,138,.35)}.card.done .no{color:var(--g)}
.no{position:absolute;top:24px;right:28px;font:600 13px var(--mf);color:var(--mu);letter-spacing:.14em}
.ic{position:absolute;top:60px;right:27px;font-size:30px;filter:drop-shadow(0 0 14px var(--c))}
.cardtag{display:inline-flex;width:max-content;margin-bottom:26px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--c) 42%,transparent);border-radius:99px;color:var(--c);font:700 12px var(--mf);letter-spacing:.16em}
.preview{display:flex;align-items:center;gap:7px;margin-bottom:22px;overflow:hidden}
.mini{flex:0 0 44px;height:44px;display:grid;place-items:center;border:1px solid rgba(120,160,220,.2);border-radius:10px;background:rgba(3,10,24,.8)}
.mini svg{width:28px;height:28px}
.preview b{font:400 11px var(--mf);color:rgba(127,147,182,.6)}
.cardcopy{display:flex;flex-direction:column;gap:9px;margin-top:auto;padding-right:90px}
.cardcopy b{font-size:clamp(27px,3vw,40px);line-height:.95;letter-spacing:-.04em}
.cardcopy span{font:600 11px var(--mf);letter-spacing:.1em;color:var(--mu);text-transform:uppercase}
.try{position:absolute;right:27px;bottom:27px;color:var(--c);font:600 10px var(--mf);letter-spacing:.16em}
.try strong{display:inline-block;margin-left:4px;font-size:18px;transition:.25s}.card:hover .try strong{transform:translate(4px,-3px)}

.wrap{width:min(1180px,100% - 2*var(--p));margin:0 auto;padding:34px 0 90px}
.wrap>h3{font-size:clamp(40px,7vw,80px);line-height:.9;margin:30px 0 26px;letter-spacing:-.05em}
.bk{border:1px solid var(--ln);background:var(--gl);border-radius:10px;padding:9px 14px;color:var(--mu)}.bk:hover{color:var(--ink);border-color:var(--cy)}
.ask{font-size:clamp(17px,2vw,22px);color:var(--mu);margin:-10px 0 24px;max-width:720px;line-height:1.4}
.st{margin-top:20px;border:1px solid var(--ln);border-radius:24px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.25)}

.inp{display:block;width:calc(100% - 48px);margin:24px auto 0;padding:11px 14px;border-radius:10px;border:1px solid var(--ln);background:#050d1e;font:600 16px var(--mf)}
.pipe{display:flex;overflow-x:auto;margin:24px 18px 0;padding:34px 24px;justify-content:safe center;border:1px dashed var(--ln);border-radius:14px;background:rgba(2,8,20,.7)}
.nd{position:relative;flex:0 0 116px;padding:16px 8px;border:1px solid var(--ln);border-radius:12px;background:var(--gl);text-align:center;color:var(--mu);transition:.3s}

.nd s{display:block;min-height:15px;margin-top:6px;text-decoration:none;font:600 10px var(--mf);color:var(--cy)}
.nd.seen{border-color:rgba(79,216,255,.5)}.nd.seen svg{opacity:.95}
.nd.on{border-color:var(--cy);box-shadow:0 0 34px rgba(79,216,255,.5);transform:translateY(-6px)}

.rv small{display:block;margin-top:6px;font-weight:400;font-size:14px;color:var(--mu)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
abbr{position:relative;text-decoration:underline dotted var(--cy);text-underline-offset:4px;cursor:help;outline:none}
abbr:hover:after,abbr:focus:after{content:attr(data-d);position:absolute;left:0;bottom:calc(100% + 8px);width:min(250px,70vw);padding:10px 12px;border-radius:10px;background:#0b1a36;border:1px solid var(--cy);color:var(--ink);font:500 12px/1.45 var(--hf);letter-spacing:0;text-transform:none;white-space:normal;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.cf{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:99}
@media(max-width:800px){.cards{grid-template-columns:1fr}.playground{padding-top:70px}.cardcopy{padding-right:0}.try{position:static;margin-top:16px}.pipe{justify-content:flex-start}.tab{min-width:125px}.ex{margin:16px}.inp{width:calc(100% - 32px)}}
